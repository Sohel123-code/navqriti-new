<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <style>html[data-detail-page],html[data-detail-page] body{background:#050505}</style>
    <script>
      if (/^\/(ai|quantum|contact)\/?$/.test(location.pathname)) {
        document.documentElement.dataset.detailPage = "true";
        const font = document.createElement("link");
        font.rel = "preload"; font.as = "font"; font.type = "font/woff2";
        font.href = "/fonts/inter-ai.woff2"; font.crossOrigin = "anonymous";
        document.head.appendChild(font);
        if (/^\/ai\/?$/.test(location.pathname)) {
          const poster = document.createElement("link");
          poster.rel = "preload"; poster.as = "image";
          poster.href = window.innerWidth < 768 ? "/images/ai/orb-poster-mobile.png" : "/images/ai/orb-poster.png";
          document.head.appendChild(poster);
        }
      }
    </script>
    <meta
      name="description"
      content="NavQriti connects scientific research, frontier technology and purposeful innovation to create solutions for complex real-world challenges. Discover. Create. Deploy."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <title>NavQriti — Creating What Comes Next.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
